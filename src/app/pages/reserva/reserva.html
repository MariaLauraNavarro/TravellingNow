<app-header></app-header>
<h2>Reserva</h2>

@if (destino) {
  <h3>{{ destino.nombre }}</h3>

  <img
    [src]="destino.imagen"
    [alt]="destino.nombre"
    width="300">

  <p>{{ destino.descripcion }}</p>

  <p>Precio: ${{ destino.precio }}</p>

  
  <p>   Total: ${{ destino.precio * cantidadPasajeros }}</p>

  <div class="formulario-reserva">

  <h3>Datos de la reserva</h3>
  <input
  type="text"
  placeholder="Nombre y apellido"
  [(ngModel)]="nombreApellido">

<input
  type="email"
  placeholder="Email"
  [(ngModel)]="email"
  readonly>

<div class="campo-reserva">
  <label for="cantidadPasajeros">Cantidad de pasajeros</label>

  <input
    id="cantidadPasajeros"
    type="number"
    min="1"
    [(ngModel)]="cantidadPasajeros">
</div>
<div class="fechas-reserva">

  <div class="campo-reserva">
    <label for="fechaDesde">Desde</label>

    <input
      id="fechaDesde"
      type="date"
      [(ngModel)]="fechaDesde">
  </div>

  <div class="campo-reserva">
    <label for="fechaHasta">Hasta</label>

    <input
      id="fechaHasta"
      type="date"
      [(ngModel)]="fechaHasta">
  </div>

</div>




 <button (click)="confirmarReserva()">
  Confirmar reserva
 </button>

</div>
}
